<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ตัวอย่างหน้าจอ 0.7.9 · ข้อมูลจำลอง</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap"><style>/* ============================================================================
   ระบบค่าหมาย · app.css — ธีม 3D ปั้นนูน (Claymorphism) เขียวอ่อน สบายตา
   ตัวอักษรผ่านเกณฑ์ความต่างสี 4.5:1 · พื้นที่แตะ ≥ 44px
   ========================================================================== */
:root{
  --bg1:#D6E8DA; --bg2:#E6EFE2; --bg3:#EEEBDD;
  --card:#F8FCF9; --card2:#EEF6F0; --mint:#DDF0E2; --mint2:#C9E5D1; --sunk:#E7F1EA;
  --g:#2E6B4F; --g2:#3C8463; --g-ink:#21503A;
  --ink:#1D3A2C; --ink2:#2F4D3D; --muted:#4B6657; --faint:#5E7A6A;
  --line:#DCE8DF; --gold:#E9C35E; --gold-bg:#FBE7A8; --cream:#FFF6DD; --cream2:#F5E3AE; --cream-ink:#6B4B0E;
  --red:#B4232A; --red-bg:#FDEBEC; --amber:#8A5A00; --amber-bg:#FFF2D6; --blue:#1F5FA8; --blue-bg:#E7F0FB;
  --r:22px; --r-s:14px;
  --sh-out:10px 14px 28px rgba(52,92,68,.16),-8px -8px 20px rgba(255,255,255,.75),inset 2px 2px 3px rgba(255,255,255,.95),inset -3px -4px 8px rgba(120,160,135,.16);
  --sh-btn:5px 7px 14px rgba(52,92,68,.16),-5px -5px 12px rgba(255,255,255,.95),inset 2px 2px 3px rgba(255,255,255,.9),inset -2px -3px 6px rgba(120,160,135,.15);
  --sh-in:inset 4px 4px 10px rgba(60,100,75,.18),inset -4px -4px 10px rgba(255,255,255,.95);
  --sh-green:4px 6px 12px rgba(35,90,62,.35),inset 2px 2px 3px rgba(255,255,255,.25),inset -2px -3px 5px rgba(15,55,35,.35);
  --font:'Noto Sans Thai',Sarabun,'Leelawadee UI',Tahoma,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--font);color:var(--ink);background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 55%,var(--bg3) 100%) fixed;font-size:16px;line-height:1.55}
a{color:var(--g)}a:hover{color:var(--g-ink)}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:3px solid rgba(46,107,79,.45);outline-offset:2px}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- พื้นฐาน clay ---------- */
.clay{background:linear-gradient(160deg,var(--card),var(--card2));border-radius:var(--r);box-shadow:var(--sh-out)}
.clay-mint{background:linear-gradient(150deg,var(--mint),var(--mint2));border-radius:var(--r);box-shadow:8px 12px 22px rgba(52,110,78,.18),-6px -6px 16px rgba(255,255,255,.8),inset 3px 3px 6px rgba(255,255,255,.75),inset -4px -6px 10px rgba(70,130,95,.16)}
.sunk{background:var(--sunk);border-radius:18px;box-shadow:var(--sh-in)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border:none;border-radius:16px;background:linear-gradient(160deg,#fff,#EEF5F0);color:var(--ink);font-weight:700;cursor:pointer;box-shadow:var(--sh-btn);transition:transform .08s ease}
.btn:active{transform:translateY(2px);box-shadow:var(--sh-in)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn-g{background:linear-gradient(160deg,var(--g2),var(--g));color:#fff;box-shadow:var(--sh-green)}
.btn-sm{min-height:40px;padding:0 14px;border-radius:12px;font-size:14px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 12px;border-radius:999px;font-size:13px;font-weight:700;background:#EEF5F0;color:var(--ink2)}
.pill.g{background:#DDF0E2;color:var(--g-ink)}.pill.r{background:var(--red-bg);color:var(--red)}.pill.a{background:var(--amber-bg);color:var(--amber)}.pill.b{background:var(--blue-bg);color:var(--blue)}
.muted{color:var(--muted)}.small{font-size:14px}.tiny{font-size:13px}
h1,h2,h3{margin:0;line-height:1.3}

/* ---------- เข้าสู่ระบบ ---------- */
.login{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:28px 14px}
.login-card{width:100%;max-width:420px;border-radius:34px;padding:22px 18px 20px;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;gap:12px}
.seal{width:52px;height:52px;flex:none;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF6DC 0%,#F1D58C 45%,#C99A3E 100%);box-shadow:3px 5px 10px rgba(140,100,30,.30),inset -2px -3px 5px rgba(150,105,25,.35),inset 2px 2px 4px rgba(255,255,255,.8);display:flex;align-items:center;justify-content:center;overflow:hidden}
.seal img{width:100%;height:100%;object-fit:contain}
.brand h1{font-size:20px;font-weight:800}.brand p{margin:0;font-size:13px;color:var(--muted)}
.welcome{position:relative;padding:20px 18px;min-height:128px;overflow:hidden}
.welcome h2{font-size:25px;font-weight:800}.welcome p{margin:6px 0 0;font-size:14px;color:var(--ink2);max-width:190px}
.mascot{position:absolute;right:12px;top:18px;width:128px;height:104px;animation:bob 4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@media (prefers-reduced-motion:reduce){.mascot{animation:none}}
.m-doc{position:absolute;right:20px;top:2px;width:62px;height:74px;border-radius:10px;background:linear-gradient(160deg,#fff,#F1F4EF);transform:rotate(10deg);box-shadow:4px 6px 10px rgba(50,90,65,.18)}
.m-doc i{display:block;margin:7px 10px 0;height:5px;border-radius:4px;background:#CFE3D5}.m-doc i:first-child{margin-top:12px;height:6px;background:#D4B061}
.m-env{position:absolute;left:6px;bottom:6px;width:100px;height:66px;border-radius:18px;background:linear-gradient(160deg,#9FD3AE,#6FB487);box-shadow:6px 9px 14px rgba(40,95,62,.30),inset 3px 3px 5px rgba(255,255,255,.55),inset -4px -6px 8px rgba(35,95,60,.30)}
.m-flap{position:absolute;left:0;right:0;top:0;height:38px;border-radius:18px 18px 30px 30px;background:linear-gradient(180deg,#B6E0C1,#8CC79E)}
.m-eye{position:absolute;top:38px;width:10px;height:5px;border-bottom:3px solid #1F4A33;border-radius:0 0 10px 10px}.m-eye.l{left:28px}.m-eye.r{right:28px}
.m-mouth{position:absolute;left:44px;top:48px;width:12px;height:6px;border-bottom:3px solid #1F4A33;border-radius:0 0 12px 12px}
.m-blush{position:absolute;top:47px;width:12px;height:7px;border-radius:50%;background:#F4A9A0;opacity:.8}.m-blush.l{left:14px}.m-blush.r{right:14px}
.m-coin{position:absolute;left:0;top:10px;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF3C8,#E7C15C 55%,#B98A2B);box-shadow:2px 4px 7px rgba(150,110,30,.35)}
.steps{margin:0;padding:0;list-style:none;display:flex;align-items:center;gap:10px}
.step{display:flex;align-items:center;gap:8px;padding:6px 16px 6px 6px;border-radius:999px;background:#EEF5F0;color:var(--muted);font-size:14px;box-shadow:3px 4px 8px rgba(60,100,75,.12),-3px -3px 6px rgba(255,255,255,.9)}
.step b{width:26px;height:26px;border-radius:50%;background:#DEEBE2;display:flex;align-items:center;justify-content:center;font-size:13px}
.step.on{background:linear-gradient(160deg,var(--g2),var(--g));color:#fff;font-weight:700;box-shadow:var(--sh-green)}.step.on b{background:#fff;color:var(--g)}
.step-line{width:26px;height:6px;border-radius:6px;background:#DCE8DF;box-shadow:inset 1px 1px 2px rgba(70,110,85,.2)}
.field{display:flex;align-items:center;gap:10px;height:56px;padding:0 18px}
.field input{flex:1;min-width:0;border:none;background:transparent;font-size:17px;outline:none}
.field:focus-within{box-shadow:var(--sh-in),0 0 0 3px rgba(46,107,79,.25)}
.picks{display:flex;flex-direction:column;gap:10px}
.pick{display:flex;align-items:center;gap:12px;min-height:60px;padding:10px 14px;border:none;border-radius:20px;text-align:left;width:100%;background:linear-gradient(160deg,#fff,#F1F7F3);box-shadow:6px 8px 16px rgba(52,92,68,.14),-5px -5px 12px rgba(255,255,255,.9);cursor:pointer;transition:transform .15s}
.pick:hover{transform:translateY(-2px)}
.avatar{width:40px;height:40px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;box-shadow:2px 4px 7px rgba(60,80,60,.22),inset 2px 2px 3px rgba(255,255,255,.55),inset -2px -3px 4px rgba(0,0,0,.10)}
.av0{background:radial-gradient(circle at 35% 30%,#FFE1C7,#F2A774);color:#5A2E12}.av1{background:radial-gradient(circle at 35% 30%,#D9F0DF,#8CC79E);color:#1F4A33}
.av2{background:radial-gradient(circle at 35% 30%,#FFF2C4,#E9C35E);color:#5C4310}.av3{background:radial-gradient(circle at 35% 30%,#DCE9F7,#9DBBE0);color:#1E3A5C}
.pick .nm{display:flex;flex-direction:column;flex:1;min-width:0}.pick .nm b{font-size:16px}.pick .nm span{font-size:13px;color:var(--muted)}
mark{background:var(--gold-bg);color:var(--ink);border-radius:4px;padding:0 2px}
.who{display:flex;align-items:center;gap:10px;padding:12px 10px 12px 12px}
.who .avatar{display:none}
.who .nw,.pick .nw{white-space:nowrap}
.dots{display:flex;gap:20px;justify-content:center;padding:2px 0}
.dot{width:20px;height:20px;border-radius:50%;background:#E3EEE6;box-shadow:inset 2px 2px 4px rgba(60,100,75,.22),inset -2px -2px 4px rgba(255,255,255,.95)}
.dot.on{background:radial-gradient(circle at 35% 30%,#7CC196,var(--g));box-shadow:2px 3px 6px rgba(35,90,62,.35),inset 1px 1px 2px rgba(255,255,255,.45)}
.dots.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pin-msg{min-height:24px;text-align:center;font-size:15px;font-weight:700;color:var(--muted);margin:0}.pin-msg.err{color:var(--red)}.pin-msg.ok{color:var(--g)}
.keypad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.key{height:60px;border:none;border-radius:20px;background:linear-gradient(160deg,#fff,#EEF5F0);font-size:24px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-btn);transition:transform .08s}
.key:active{transform:translateY(2px);box-shadow:var(--sh-in)}
.key.clr{background:linear-gradient(160deg,var(--cream),var(--cream2));color:var(--cream-ink);font-size:16px}
.foot{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;color:var(--muted);text-align:center}
.foot p{margin:0}

/* ---------- โครงแอป ---------- */
.app{display:flex;min-height:100vh;gap:18px;padding:18px}
.side{width:248px;flex:none;padding:18px 14px;display:flex;flex-direction:column;gap:14px;align-self:flex-start;position:sticky;top:18px}
.nav{display:flex;flex-direction:column;gap:8px}
.nav button{display:flex;align-items:center;gap:10px;min-height:46px;padding:0 14px;border:none;border-radius:16px;background:transparent;text-align:left;font-weight:600;color:var(--ink2);cursor:pointer}
.nav button:hover{background:#EEF5F0}
.nav button.on{background:linear-gradient(160deg,var(--g2),var(--g));color:#fff;box-shadow:var(--sh-green)}
.nav button[disabled]{opacity:.6;cursor:default;background:transparent}
.nav .soon{margin-left:auto;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;background:#EEF5F0;color:var(--muted)}
.nav-sec{font-size:12px;font-weight:700;color:var(--faint);padding:6px 14px 0}
.me{display:flex;align-items:center;gap:10px;padding:10px}
.me .nm{display:flex;flex-direction:column;min-width:0}.me b{font-size:15px}.me span{font-size:12px;color:var(--muted)}
.main{flex:1;min-width:0;display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;gap:12px;padding:14px 18px;flex-wrap:wrap}
.top h2{font-size:22px;font-weight:800;flex:1}
.panel{padding:18px}
.panel h3{font-size:17px;font-weight:800;margin-bottom:10px}
.grid-k{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.kpi{padding:16px}
.kpi span{display:block;font-size:13px;color:var(--muted);font-weight:600}
.kpi b{display:block;font-size:28px;font-weight:800;margin-top:2px}
.kpi.mint{background:linear-gradient(150deg,var(--mint),var(--mint2))}
.tbl-wrap{overflow-x:auto;border-radius:16px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--muted);font-weight:700;background:#F1F7F3;position:sticky;top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.sel{min-height:44px;padding:0 12px;border:none;border-radius:14px;background:var(--sunk);box-shadow:var(--sh-in)}
.inp{min-height:44px;padding:0 14px;border:none;border-radius:14px;background:var(--sunk);box-shadow:var(--sh-in);min-width:0}
.note{padding:12px 14px;border-radius:16px;background:var(--amber-bg);color:var(--amber);font-size:14px}
.note.g{background:#E3F1E8;color:var(--g-ink)}.note.r{background:var(--red-bg);color:var(--red)}

/* ---------- นำเข้า ---------- */
.kinds{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.kind{padding:18px;border:none;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.kind b{font-size:18px}.kind.on{outline:3px solid var(--g)}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:150px;padding:20px;text-align:center;cursor:pointer;border:2px dashed #A9C7B4}
.drop.over{background:#DDF0E2}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{padding:10px 14px;border-radius:16px;border:none;cursor:pointer;font-weight:700;background:linear-gradient(160deg,#fff,#EEF5F0);box-shadow:var(--sh-btn);display:flex;flex-direction:column;align-items:flex-start;min-width:110px}
.chip span{font-size:12px;color:var(--muted)}.chip b{font-size:22px}
.chip.on{outline:3px solid var(--g)}
.c-NEW b{color:var(--g)}.c-CHANGED b{color:var(--blue)}.c-HELD b{color:var(--amber)}.c-AMBIGUOUS b{color:var(--amber)}.c-ERROR b{color:var(--red)}.c-OUTSIDE b{color:var(--faint)}
.map td{vertical-align:middle}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);padding:12px 18px;border-radius:16px;background:var(--ink);color:#fff;font-weight:600;z-index:50;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid rgba(46,107,79,.25);border-top-color:var(--g);animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- มือถือ ---------- */
@media (max-width:860px){
  .app{flex-direction:column;padding:12px;gap:12px}
  .side{width:100%;min-width:0;max-width:100%;position:static;padding:12px}
  .nav{flex-direction:row;overflow-x:auto;gap:8px;padding-bottom:4px;max-width:100%}
  .nav button{white-space:nowrap;flex:none}
  .nav-sec{display:none}
  .side .me-wrap{display:flex;align-items:center;gap:10px}
  .side .me{flex:1;min-width:0;padding:6px 10px}
  .side .me .nm b,.side .me .nm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .side #logout{width:auto!important;margin-top:0!important;flex:none}
  .main{min-width:0;max-width:100%}
  .top h2{font-size:19px}
  .kpi b{font-size:24px}
}

/* ---------- 0.6.2 กล่องชนิดไฟล์: นำเข้าแล้ว (เขียว) / ยังไม่เคยนำเข้า (เทา) ---------- */
.kind.kind-none{background:linear-gradient(150deg,#F4F5F2,#E4E8E3);border-radius:var(--r);box-shadow:6px 10px 18px rgba(60,70,64,.12),-6px -6px 14px rgba(255,255,255,.8),inset 2px 2px 5px rgba(255,255,255,.7)}
.kind.kind-none b{color:var(--ink2)}
.kind .kstat{display:block;margin-top:6px;padding:6px 10px;border-radius:10px;font-size:13px;line-height:1.55;background:rgba(255,255,255,.55);color:var(--muted)}
.kind .kstat.ok{background:var(--g);color:#fff}
.kind .kstat b{font-size:13px;display:inline;margin:0;font-weight:700;white-space:nowrap}
.kdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#D5DAD4;vertical-align:-1px;margin-right:2px}
.kdot.ok{background:var(--g2)}
/* ---------- 0.6.2 เมนูมือถือ: ปุ่มค้นหาย่อ + ปุ่ม "เมนู ›" ---------- */
.nav-row{display:block}
.nav-more{display:none}
.qs-short{display:none}
@media (max-width:860px){
  .nav-row{display:flex;align-items:center;gap:8px;min-width:0}
  .nav-row .nav{flex:1;min-width:0;scrollbar-width:none}
  .nav-row .nav::-webkit-scrollbar{display:none}
  .nav.fade{-webkit-mask-image:linear-gradient(to right,#000 82%,transparent);mask-image:linear-gradient(to right,#000 82%,transparent)}
  .nav .qs-btn{width:auto!important;flex:none;margin:0!important;min-height:46px;padding:0 14px;border-radius:16px}
  .nav .qs-btn kbd,.nav .qs-btn .qs-long{display:none}
  .nav .qs-short{display:inline-flex;align-items:center;gap:6px}
  .nav-more{display:flex;align-items:center;gap:6px;flex:none;min-height:46px;padding:0 14px;border:none;border-radius:16px;
    background:linear-gradient(160deg,var(--g2),var(--g));color:#fff;font-weight:700;box-shadow:var(--sh-green);cursor:pointer;white-space:nowrap}
  .nav-more span{font-size:20px;line-height:1}
  .nav-more.hide{display:none}
}

/* ---------- 0.6.5 กล่องยืนยันกลางจอ ---------- */
.ask-ov{position:fixed;inset:0;z-index:80;background:rgba(29,58,44,.32);display:flex;align-items:center;justify-content:center;padding:16px;animation:askIn .15s ease-out}
.ask{width:min(440px,100%);padding:22px 22px 18px;border-radius:var(--r);background:var(--card)!important;box-shadow:0 18px 50px rgba(20,50,35,.35)!important}
.ask-msg{margin:0 0 14px;white-space:pre-line;font-size:16px;line-height:1.7;color:var(--ink);font-weight:600}
.ask-in{width:100%;margin:0 0 14px}
.ask-in.ask-need{outline:2px solid var(--red)}
.ask-btns{display:flex;gap:10px;justify-content:flex-end}
.ask-btns .btn{min-width:96px}
@keyframes askIn{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.ask-ov{animation:none}}

/* ---------- 0.6.3 แถวรอตรวจ ---------- */
.rvcs{display:flex;flex-direction:column;gap:6px}
.rvc{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:12px;background:var(--card);box-shadow:var(--sh-btn);cursor:pointer}
.rvc.like{outline:2px solid var(--g2)}
.rvc.dis{opacity:.7;cursor:default}
.rvc input{margin-top:4px;flex:none}

/* หมายเหตุสีแดง: เงินไม่เท่ากับอัตราของตำบล (ยืนยันแล้วว่าถูกต้อง แต่ต้องเห็นชัด) */
.flag-r{color:var(--red);font-weight:700}
.flag-a{color:var(--amber)}
.period{display:inline-flex;gap:6px;align-items:center;padding:4px 12px;border-radius:999px;background:var(--blue-bg);color:var(--blue)}
/* ตราศาล แบบเดียวกับระบบวัสดุสำนักงาน (รูปตรา ไม่มีวงกลมพื้นหลัง) */
.seal.seal-img{width:42px;height:56px;border-radius:0;background:none;box-shadow:none;overflow:visible}
.seal.seal-img img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 2px 3px rgba(60,40,10,.18))}
/* ข้อความกำกับที่มาของไฟล์ (เมนูนำเข้า) */
.kind .howto{display:block;margin-top:8px;padding:6px 10px;border-radius:10px;background:rgba(255,255,255,.65);color:var(--g-ink);font-size:13px;line-height:1.5}
.kind .howto b{font-weight:700;font-size:13px;display:inline;margin:0}
tr.sum td{background:var(--card2)}
.btn-s{padding:6px 12px;font-size:13px}
.flag-ok{color:var(--amber);font-weight:700}
.chk-acts{display:flex;flex-wrap:wrap;gap:6px}
td .btn-s{white-space:nowrap}

/* ---------- ลูกเล่น 0.4.2: แถบสีสถานะ · กราฟเส้น · ค้นด่วน · ใบสรุปพิมพ์ ---------- */
.stbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--sunk);box-shadow:var(--sh-in);margin:2px 0 4px;min-width:120px}
.stbar i{display:block;height:100%}
.stlegend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:12px 2px 0;font-size:12px;color:var(--ink2)}
.stlegend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.spark{display:block}
.stchip{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;color:var(--ink);background:color-mix(in srgb,var(--c) 22%,#fff);border:1px solid color-mix(in srgb,var(--c) 55%,#fff)}
.qs-btn{display:flex!important;align-items:center;justify-content:space-between;gap:8px;width:100%;margin:0 0 10px;background:var(--sunk)!important;box-shadow:var(--sh-in)!important;color:var(--muted)!important;font-weight:600}
.qs-btn kbd{font-family:inherit;font-size:11px;padding:1px 6px;border-radius:6px;background:var(--card);color:var(--faint)}
.qs-ov{position:fixed;inset:0;z-index:60;background:rgba(29,58,44,.28);display:flex;align-items:flex-start;justify-content:center;padding:9vh 14px 14px}
.qs{width:min(620px,100%);max-height:78vh;display:flex;flex-direction:column;padding:14px}
.qs-in{display:flex;gap:8px;align-items:center}.qs-in .inp{flex:1}
.qs-r{overflow:auto;margin-top:10px}
.qs-item{padding:10px 12px;border-radius:var(--r-s);background:var(--card);margin:0 0 8px;box-shadow:var(--sh-btn)}
.qs-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:2px}
#printArea{display:none}
@media print{
  @page{size:A4 portrait;margin:15mm 15mm 18mm}
  body{background:#fff!important}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;font-family:'TH Sarabun New','TH SarabunPSK',Sarabun,serif;font-size:16pt;line-height:1.3;color:#000}
  .pr-head{text-align:center;margin-bottom:10pt}.pr-head img{width:20mm;height:auto;display:block;margin:0 auto 4pt}
  .pr-court{font-size:18pt;font-weight:700}.pr-title{font-size:18pt;font-weight:700}.pr-sub{font-size:14pt}
  .pr-tbl{width:100%;border-collapse:collapse;font-size:14pt}
  .pr-tbl th,.pr-tbl td{border:0.6pt solid #000;padding:2pt 5pt;vertical-align:top}
  .pr-tbl th{font-weight:700;text-align:center;font-size:14pt;color:#000!important;background:none!important;text-transform:none;letter-spacing:0;vertical-align:middle}
  .pr-tbl td{color:#000}.pr-tbl .n{text-align:right;white-space:nowrap}.pr-tbl .c{text-align:center}
  .pr-sum td{border-top:1.2pt solid #000}
  .pr-note{font-size:14pt;margin-top:10pt}
  .pr-sign{display:flex;justify-content:space-between;gap:20pt;margin-top:28pt;text-align:center;font-size:16pt;page-break-inside:avoid}
  .pr-sign>div{flex:1}
}

/* ---------- 0.4.3: การ์ดค่อย ๆ ปรากฏ · วงแหวน 3 มิติ ---------- */
.rv{opacity:0;transform:translateY(16px) scale(.985);transition:opacity .45s ease,transform .5s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}}
.dn-legend{display:flex;flex-direction:column;gap:6px}
.dn-lg{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;cursor:pointer;padding:9px 12px;border-radius:var(--r-s);background:var(--card);box-shadow:var(--sh-btn);color:var(--ink);font-weight:600}
.dn-lg i{width:12px;height:12px;border-radius:4px;flex:none}
.dn-lg span{flex:1;font-size:14px}.dn-lg b{font-size:15px}
.dn-lg.on{background:var(--sunk);box-shadow:var(--sh-in)}

/* ---------- ตัดบรรทัดภาษาไทย (0.4.4) ---------- */
body{line-break:strict;overflow-wrap:break-word}
h1,h2,h3,.kpi span,.note,.kind b,.btn,th{text-wrap:balance}
p,td,.small,.tiny,li{text-wrap:pretty}
.kpi b{white-space:nowrap;font-size:clamp(22px,2.3vw,30px);letter-spacing:-.01em}
.kpi .tiny{display:block;text-wrap:balance}
.btn,.chip,.stchip,kbd,.flag-ok,.flag-r{white-space:nowrap}
td.n,th.n{white-space:nowrap}
.nb{white-space:nowrap}

/* ---------- หน้าแรกแบบเบนโต (0.4.4) ---------- */
.bento{container-type:inline-size}
.bn{display:grid;gap:16px;grid-template-columns:repeat(2,minmax(0,1fr));
  grid-template-areas:"hero hero" "k1 k1" "k2 k3" "k4 k5" "nt nt" "al al" "off off"}
@container (min-width:600px){.bn{grid-template-areas:"hero hero" "k1 k2" "k3 k4" "k5 nt" "al al" "off off"}}
@container (min-width:900px){.bn{grid-template-columns:repeat(4,minmax(0,1fr));
  grid-template-areas:"hero hero k1 k2" "hero hero k3 k4" "hero hero k5 nt" "al al al al" "off off off off"}}
.bn>.panel,.bn>.kpi{margin:0}
.hero{display:flex;flex-direction:column;gap:14px;min-width:0}
.hero-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hero-h h3{margin:0}
.hero-t{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.hero-t b{font-size:clamp(30px,4.2vw,44px);font-weight:800;line-height:1.05;white-space:nowrap;letter-spacing:-.01em}
.hero-t span{font-size:14px;font-weight:600;color:var(--muted)}
.mbar{display:flex;gap:3px;height:24px;width:100%}
.mseg{height:24px;width:0;min-width:0;border:0;padding:0;cursor:pointer;background:var(--c);border-radius:5px;transition:width .7s cubic-bezier(.3,.7,.3,1),opacity .25s,transform .2s;box-shadow:inset 0 2px 0 rgba(255,255,255,.35),inset 0 -3px 6px rgba(0,0,0,.08)}
.mseg:first-child{border-radius:12px 5px 5px 12px}.mseg:last-child{border-radius:5px 12px 12px 5px}.mseg:only-child{border-radius:12px}
.mseg:hover{transform:scaleY(1.12)}
.mleg{display:flex;flex-direction:column;gap:6px}
.dn-lg em{font-style:normal;font-size:13px;color:var(--muted);width:46px;text-align:right}
.dn-lg b{white-space:nowrap;min-width:92px;text-align:right}
.dn-lg.zero{opacity:.55}
.mseg.dim,.dn-lg.dim{opacity:.35}
.mseg.on{transform:scaleY(1.18)}
.stt{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.stt-t{flex-direction:column;align-items:stretch!important;gap:6px!important;padding:14px!important;text-align:left}
.stt-t.big{grid-column:span 2}
@container (min-width:900px){.stt{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}.stt-t.big{grid-column:auto;grid-row:span 2;justify-content:center}}
.stt-h{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--ink2)}
.stt-h i{width:10px;height:10px;border-radius:50%;flex:none}
.stt-t b{font-size:22px;min-width:0;text-align:left}.stt-t.big b{font-size:30px}
.stt-bar{display:block;height:8px;border-radius:4px;background:rgba(46,107,79,.10);overflow:hidden}
.stt-bar i{display:block;height:8px;width:0;background:var(--c);border-radius:4px;transition:width .7s cubic-bezier(.3,.7,.3,1)}
/* กล่องตัวเลข สีอ่อนจาง เข้ากับระบบ */
.kt{position:relative;display:flex;flex-direction:column;gap:2px;padding:16px 18px;min-width:0}
.kt small{font-size:12.5px;font-weight:600;opacity:.85;text-wrap:balance}
.kt-ic{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:12px;display:flex!important;align-items:center;justify-content:center;background:rgba(255,255,255,.7);box-shadow:inset 0 1px 0 #fff,0 4px 10px -6px rgba(0,0,0,.25)}
.kt>span:not(.kt-ic){padding-right:40px}
.kt.k-all{background:linear-gradient(150deg,#E4F3E8,#CDE8D5);color:#21503A}
.kt.k-paid{background:linear-gradient(150deg,#FDF5DF,#F7E7BC);color:#6B4B0E}
.kt.k-free{background:linear-gradient(150deg,#EAF2FB,#D6E6F7);color:#1F4F86}
.kt.k-wait{background:linear-gradient(150deg,#F3F2EE,#E5E3DC);color:#4E4D46}
.kt.k-done{background:linear-gradient(150deg,#EEF5E3,#DCEBC8);color:#3F6A12}
.kt span:not(.kt-ic),.kt small{color:inherit}
.kt b{color:var(--ink)}
.kt-nt h3{margin:0 0 10px}
.stt-t>span{flex:none!important}
.stt-h{text-wrap:balance;line-height:1.35}

/* ---------- รอบเบิก / วันจ่าย 60:40 (0.5.0) ---------- */
.pchip{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.pchip.pm{background:#FDF0CF;color:#6B4B0E}.pchip.pf{background:#DCEAF8;color:#1F4F86}
.pchip.ph{background:#FFE7C2;color:#8A5300}.pchip.pok{background:#E1F1D3;color:#3F6A12}.pchip.pcx{background:#F1F0EC;color:#5F5E57}
.odot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:middle}
.pform{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));align-items:end}
.pform label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;color:var(--muted)}
.pform fieldset{border:none;margin:0;padding:0;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.pform legend{font-size:14px;font-weight:600;color:var(--muted);margin-bottom:6px;padding:0}
.ck{display:inline-flex !important;flex-direction:row !important;align-items:center;gap:8px;cursor:pointer;color:var(--ink) !important}
.ck input,.pit input{width:20px;height:20px;accent-color:var(--g)}
.pgrid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1100px){.pgrid{grid-template-columns:minmax(0,1.1fr) minmax(440px,1fr);align-items:start}.psum{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto}}
.psum .ptbl{font-size:13px}.psum .ptbl th,.psum .ptbl td{padding:8px 6px}
.plist{display:flex;flex-direction:column;gap:14px;min-width:0}
.poff{margin:0}.poff-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.pit{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:10px 8px;border-top:1px solid rgba(46,107,79,.10);cursor:pointer;border-radius:10px}
.pit:hover{background:rgba(46,107,79,.04)}
.pit .pcase{font-weight:600;min-width:0;overflow-wrap:anywhere}
.pit .pamt{grid-column:4;grid-row:1;white-space:nowrap}
.pit .pdt{grid-column:3;grid-row:2}
.pit .ph{grid-column:2 / 4;grid-row:3;justify-self:start}
.pit .pnot{display:none;grid-column:4;grid-row:2;font-size:12px;font-weight:700;color:#8A5300;white-space:nowrap}
.pit.out{opacity:.62}.pit.out .pamt{text-decoration:line-through}.pit.out .pnot{display:block}
.psum{margin:0}.psum h3{margin-top:0}
.ptbl tfoot td{border-top:2px solid rgba(46,107,79,.25)}
.pool{display:grid;gap:6px;margin-top:12px;padding:12px 14px;border-radius:16px;background:var(--sunk);box-shadow:var(--sh-in)}
.pool div{display:flex;justify-content:space-between;gap:10px;font-size:14px}.pool b{white-space:nowrap}
.pool .ps{font-size:16px;padding:6px 0;border-top:1px dashed rgba(46,107,79,.25);border-bottom:1px dashed rgba(46,107,79,.25)}
.pool .ps b{font-size:22px;color:var(--g-ink)}
.pseat{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;color:var(--muted);margin:12px 0}
.bn4{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}

.ptbl .pcnt{display:block;font-size:11px;color:var(--muted,#7a8a80);font-weight:400;line-height:1.2}.ptbl td.n{white-space:nowrap}.ptbl td.pnm{white-space:nowrap}

.flag-up{color:#a8620a;font-weight:600}.nb.flag-up,.nb.flag-r{font-weight:700}.pit .flag-up,.pit .flag-r{white-space:nowrap;margin-left:6px}

/* 0.6.0 รอบเบิกตามบัญชีจริง */
.pit{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
.pit>input,.pit>.pdot{flex:none}
.pit .pcase{flex:1 1 200px}
.pit .pamt{margin-left:auto;order:3}
.pit .pdt{flex:1 1 100%;order:4;padding-left:30px}
.pit .ph,.pit .flag-up,.pit .flag-r,.pit .tiny.muted:not(.pdt){order:5}
.pit .pnot{order:6;margin-left:auto}
.pit.pzero{opacity:.72}
.pit.pzero .pamt{color:var(--muted);font-weight:500}
.pit.out-i{cursor:default;opacity:.85}
.pdot{width:10px;height:10px;border-radius:50%;background:#7BB36B;display:inline-block}
.pdot.r{background:#D9534F}
.pinfo{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.pinfo-r{display:flex;gap:10px;align-items:flex-start}
.pinfo-r>.pchip{margin-top:2px}
.pdates{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.pdate{font-size:13px}
.ptgt{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin:0}
.ptin{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
.ptin .inp{width:130px;min-height:36px;padding:4px 10px;text-align:right}
.btn-xs{min-height:28px;padding:0 10px;border-radius:9px;font-size:12px}
.pseat .tiny{font-weight:400}
.pr-grp td{background:#f3f3f3;border-top:1pt solid #000}
@media (max-width:640px){.pit .pdt{padding-left:0}.ptin .inp{width:110px}}
.pdet>summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--muted);padding:6px 4px}

/* 0.6.6 · ชื่อผู้ส่งบรรทัดเดียว + ปุ่มจัดลำดับ ▲▼ ที่หัวคอลัมน์ */
td.onm{white-space:nowrap}
th[data-sort]{white-space:nowrap;vertical-align:bottom}
.srt{display:flex;justify-content:flex-end;gap:3px;margin-top:5px}
th:not(.n) .srt{justify-content:flex-start}
.srt button{width:22px;height:22px;padding:0;border:none;border-radius:7px;font-size:10px;line-height:22px;color:var(--muted);
  background:linear-gradient(160deg,#fff,#E6F0EA);box-shadow:1px 2px 4px rgba(52,92,68,.18),inset 1px 1px 1px rgba(255,255,255,.8);cursor:pointer}
.srt button:hover{color:var(--ink)}
.srt button.on{color:#fff;background:linear-gradient(160deg,var(--g2),var(--g))}
@media print{.srt{display:none}}

/* 0.7.0: workflow labels share the existing clay theme. */
.section-tabs{margin:0 0 14px;gap:8px;flex-wrap:wrap}.page-body{min-width:0}.year-input{width:110px}.nb{display:inline-block}
#trackForm label,#repForm label,#payEvidence label{display:flex;flex-direction:column;gap:5px;font-size:13px;flex:1;min-width:130px}
#trackForm .row{align-items:flex-end}#trackDetail:empty{display:none}
@media(max-width:640px){#trackForm .row{display:grid;grid-template-columns:1fr 1fr}#trackForm label{min-width:0}#trackForm .inp,#trackForm .sel{max-width:100%;width:100%}.section-tabs{gap:6px}.section-tabs .btn{flex:1;white-space:normal}}

/* 0.7.1: horizontal mobile navigation; monetary calculations are unchanged. */
.data-coverage{display:block!important;margin-top:6px!important;font-size:12px!important;font-weight:500!important;line-height:1.55;color:var(--ink2)}
.data-coverage strong{color:var(--g-ink);font-size:inherit!important;font-weight:700}
.dn-lg[data-k="ready"] b{color:var(--amber)}.dn-lg[data-k="claim"] b{color:var(--blue)}.dn-lg[data-k="paid"] b{color:var(--g-ink)}.dn-lg[data-k="check"] b{color:var(--red)}
.money40,.carry-value{color:var(--blue)!important;font-weight:700}.pool .ps b{color:var(--g-ink)}
.ptbl tbody td:nth-last-child(2),.ptbl tfoot td:nth-last-child(2){color:var(--g-ink)}.ptbl tbody td:last-child,.ptbl tfoot td:last-child{color:var(--blue)}
.report-officers td.onm{white-space:nowrap;min-width:110px}.report-officers th{white-space:nowrap}
.nav button:focus-visible,.nav-more:focus-visible,.dn-lg:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
@media(max-width:860px){
 .nav-row{align-items:center;gap:8px}.nav{position:relative;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;padding:4px 2px 8px}
 .nav button,.nav .nav-secondary,.nav.expanded .nav-secondary{display:flex;flex:0 0 auto;min-width:0;min-height:46px;white-space:nowrap;font-size:14px;padding:0 14px}
 .nav .qs-btn{display:flex}.nav-more{flex:0 0 auto;white-space:nowrap;font-size:13px;min-height:46px;padding:0 10px;max-width:none}
 .hero-h{flex-wrap:wrap;gap:10px}.hero-h h3{min-width:0}.hero-h .btn{flex:none}
 .mleg .dn-lg{grid-template-columns:12px minmax(0,1fr) auto;gap:8px}.mleg .dn-lg em{grid-column:2;font-size:12px}.mleg .dn-lg b{grid-column:3;grid-row:1 / span 2;white-space:nowrap}.mleg .dn-lg span{min-width:0}
}
@media(prefers-reduced-motion:reduce){.nav{scroll-behavior:auto}}
@media print{.money40,.carry-value,.pool .ps b,.dn-lg b{color:#000!important}}

/* 0.7.2: Thai prose wraps at word boundaries; complete tables scroll within cards. */
.panel,.page-body,.pinfo-r>div,.plist,.poff{min-width:0;max-width:100%}
.panel h3,.panel p,.note,.note .nb,.panel .flag-r,.panel .flag-up,.panel .flag-ok{white-space:normal;word-break:normal;line-break:auto;overflow-wrap:break-word}
.panel p,.note,.panel h3{text-wrap:pretty}
.tbl-wrap{min-width:0;max-width:100%;width:100%;overscroll-behavior-x:contain}
.pinfo{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.pinfo-r{min-width:0}.pinfo-r>.pchip{flex:none}
.pdates .pdate{max-width:100%;height:auto;min-height:40px;padding-top:8px;padding-bottom:8px;white-space:normal;flex-wrap:wrap;text-align:left;justify-content:flex-start}
.panel .btn:not(.nav button){white-space:normal;height:auto;padding-top:9px;padding-bottom:9px}
.closeout{display:flex;flex-direction:column;gap:14px}
.closeout p{margin:0}.closeout h3{margin:0}
#closeForm{align-items:flex-end}#closeForm label,.close-actions label{display:flex;flex-direction:column;gap:6px;min-width:0;font-size:14px}
#closeForm .inp{max-width:100%}#closeBody{display:flex;flex-direction:column;gap:14px}
.close-kpis{margin-top:4px}.close-kpis .kpi b{font-size:22px;white-space:normal}
.close-actions{align-items:flex-end;margin-top:8px}.close-table{min-width:1150px}
.close-table td:nth-child(5){overflow-wrap:anywhere;max-width:180px}
.export-links:empty{display:none}.export-links{margin-bottom:12px}
.clay.panel.data-panel{opacity:1;transform:none;transition:none}
th.onm,td.onm{white-space:nowrap;word-break:normal;overflow-wrap:normal}
#closeOfficers tbody tr{cursor:pointer}
#closeOfficers tbody tr:hover td{background:#edf6ef}
#closeOfficers .close-selected td{background:#dceee2}
#closeOfficers .close-selected td:first-child{box-shadow:inset 4px 0 var(--g)}
.close-person{display:inline-block;min-height:44px;padding:8px 4px;border:0;background:transparent;color:var(--g-ink);font:inherit;font-weight:700;white-space:nowrap;cursor:pointer;text-align:left;text-decoration:underline;text-underline-offset:4px}
.close-person[aria-pressed="true"]{color:var(--g)}
.close-detail{display:flex;flex-direction:column;gap:12px;scroll-margin-top:14px}
#closeOfficers tfoot td{background:#edf6ef;font-weight:700;border-top:2px solid var(--g)}
@media(max-width:640px){#closeForm{display:grid;grid-template-columns:1fr}#closeForm .year-input{width:130px}#closeForm label .inp:not(.year-input){width:100%}.close-actions{gap:10px}.close-actions label{width:100%}}
@page closeout{size:A4 landscape;margin:12mm}

/* 0.7.6: keep officer names intact while long warning text wraps. */
.calc-officer-toolbar{gap:12px;align-items:center}
.calc-officer-toolbar h3{margin:0}
.calc-officer-toolbar label{display:flex;flex-direction:column;gap:5px;min-width:0;max-width:100%}
.calc-officer-toolbar .sel{max-width:100%;white-space:normal}
#calcOff td.onm .tiny{display:inline-block;max-width:210px;white-space:normal}

/* 0.7.9: same clay theme, navigation follows the working sequence. */
.brand>div:last-child{min-width:0}.brand h1 span{display:block;white-space:normal;word-break:normal;overflow-wrap:break-word}
.side .brand h1{font-size:17px;line-height:1.5}.side .seal{width:42px;height:42px;flex:none}
.app-version{margin:0 6px;color:var(--muted);font-size:12px}
.nav button{padding-top:10px;padding-bottom:10px;line-height:1.5;white-space:normal;word-break:normal}
.top h2{min-width:0;word-break:normal;overflow-wrap:break-word;text-wrap:balance}
.page-description{margin:0 4px 18px;color:var(--muted);max-width:75ch;word-break:normal;overflow-wrap:break-word;text-wrap:pretty}
.workflow-intro{position:relative;border:1px solid rgba(255,255,255,.75);background:linear-gradient(120deg,#f8fcf9,#e0eee3);padding:22px}
.eyebrow{font-size:12px;font-weight:700;color:var(--g);letter-spacing:.02em}
.workflow-intro h3{margin:8px 0;font-size:clamp(20px,2vw,26px);line-height:1.55;text-wrap:balance}
.workflow-intro h3 span{display:inline-block}.workflow-intro p{margin:4px 0 18px;color:var(--muted)}
.workflow-steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;font-size:13px;font-weight:600}
.workflow-steps span{padding:10px 12px;background:rgba(255,255,255,.65);border:1px solid #fff;border-radius:12px;word-break:normal}
.bn{grid-template-areas:"k1 k1" "k2 k3" "k4 k5" "nt nt" "hero hero" "al al" "off off"}
@container (min-width:600px){.bn{grid-template-areas:"k1 k1" "k2 k3" "k4 k5" "nt nt" "hero hero" "al al" "off off"}}
@container (min-width:900px){.bn{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-areas:"k1 k1 k2 k3" "k4 k4 k5 k5" "nt nt nt nt" "hero hero hero hero" "al al al al" "off off off off"}}
.home-import h3{margin-bottom:8px}.home-import .row{align-items:center}

#trackForm label{min-width:0}#trackForm input,#trackForm select{min-width:0;width:100%;max-width:100%}
#compForm{align-items:flex-end}#compForm label{display:flex;flex-direction:column;gap:6px;font-size:14px;min-width:0}
.comp-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:18px}.comp-kpis .kpi{margin:0;min-width:0}.comp-kpis b{font-size:clamp(20px,2.6vw,30px)}

argin:-4px 2px 10px\"><span class=\"kdot ok\"></span> สีเขียว = นำเข้าแล้ว (แสดงไฟล์ล่าสุด) · <span class=\"kdot\"></span> สีเทา = ยังไม่เคยนำเข้า</p><div class=\"kinds\"><button type=\"button\" class=\"kind kind-none\" data-k=\"ISSUE\"><b>ไฟล์จ่ายหมาย</b><span class=\"small\">นำเข้าวันที่จ่ายหมาย — แบบรวมทุกคน หรือแยกรายคน · หมายใหม่จะมีสถานะ \"จ่ายหมายแล้ว รอผล\"</span><span class=\"howto\">นำเข้าไฟล์เมนู <b>บัญชีหมาย</b> › ประเภท <b>50. บัญชีจ่ายหมาย พนักงานศาลนี้ส่ง (แบบรวม)</b> › เลือกวันที่ ถึงวันที่</span><span class=\"kstat\">ยังไม่เคยนำเข้า</span></button><button type=\"button\" class=\"kind kind-none\" data-k=\"RESULT\"><b>ไฟล์ผลหมาย</b><span class=\"small\">นำเข้าวันอื่นได้ — หมายที่ส่งแล้วพร้อมวันที่ส่ง · ระบบจับคู่กับหมายเดิมแล้วเปลี่ยนเป็น \"ส่งแล้ว\"</span><span class=\"howto\">นำเข้าไฟล์เมนู <b>บัญชีหมาย</b> › ประเภท <b>42. บัญชีผลการส่งคำคู่ความ ส่งโดยเจ้าพนักงาน</b> › เลือกวันที่ ถึงวันที่</span><span class=\"kstat\">ยังไม่เคยนำเข้า</span></button><button type=\"button\" class=\"kind kind-none\" data-k=\"FREE18\"><b>ราคาหมายฟรีตามบัญชีศาล</b><span class=\"small\">ราคาหมายฟรีรายเรื่องที่ศาลคิด (รวมหมายตามข้อ 7 แล้ว) · ใช้เป็นยอดเบิกในรอบหมายฟรี · นำเข้าก่อนตั้งรอบหมายฟรีทุกครั้ง</span><span class=\"howto\">นำเข้าไฟล์เมนู <b>บัญชีหมาย</b> › ประเภท <b>18. บัญชีจ่ายหมาย พนักงานศาลนี้ส่ง หมายฟรี</b></span><span class=\"kstat\">ยังไม่เคยนำเข้า</span></button><button type=\"button\" class=\"kind kind-none\" data-k=\"PAY\"><b>บัญชีจ่ายเงินหมายมีเงิน</b><span class=\"small\">หมายมีเงินที่จ่ายจริง แยกตามวันที่จ่าย · นำเข้าทุกสัปดาห์ก่อนตั้งรอบหมายเงิน (ยอดตามไฟล์) · ไฟล์เดียวมีได้หลายวันจ่าย</span><span class=\"howto\">นำเข้าไฟล์เมนู <b>บัญชีเบิกจ่ายหมาย</b> › ประเภท <b>30. บัญชีการจ่ายเงินให้เจ้าพนักงานศาล</b> (แบบหลายใบเสร็จ) › เลือกวันที่ ถึงวันที่</span><span class=\"kstat\">ยังไม่เคยนำเข้า</span></button></div></div><div id=\"imFile\"></div><div id=\"imMap\"></div><div id=\"imPrev\"></div><p class=\"small\" style=\"margin:0 6px 6px\"><span class=\"perio ุ่น 0.7.9</p>\n    <div class=\"me-wrap\">\n      <div class=\"me sunk\">\n        <span class=\"avatar av1\" id=\"meAv\" aria-hidden=\"true\">ผ</span>\n        <span class=\"nm\"><b id=\"meName\">ผู้ดูแลจำลอง</b><span id=\"meRoles\">ผู้ดูแลระบบ</span></span>\n      </div>\n      \n    </div>\n  </aside>\n  <main class=\"main\" id=\"main\" tabindex=\"-1\"><div class=\"row section-tabs\"><button type=\"button\" class=\"btn btn-sm btn-g\">ตรวจเงินงบประมาณ</button><button type=\"button\" class=\"btn btn-sm\">ตรวจยอดทั้ง 2 ประเภท</button></div><div class=\"page-body\"><div class=\"top clay\"><h2>การเงิน · ตรวจสอบก่อนเบิก</h2></div><p class=\"page-description\">ตรวจยอดตามบัญชี ประวัติรอบ และรายการคงค้าง ก่อนจัดรอบเบิก 60/40</p><section class=\"clay panel closeout\"><h3>เงินงบประมาณ · ตรวจรายการยังไม่เบิก</h3><p class=\"small muted\">กดตรวจสอบเพื่ออ่านข้อมูลปัจจุบัน ตั้งแต่ 1 ตุลาคมของปีงบที่เลือกถึงวันที่กด (ไม่เกิน 30 กันยายน) รายการที่เบิกแล้วจะไม่แสดงในรายงานคงค้าง</p><form id=\"closeForm\" class=\"row\"><label>ปีงบประมาณ พ.ศ.<input class=\"inp year-input\" id=\"closeFy\" inputmode=\"numeric\" maxlength=\"4\" value=\"2570\" required=\"\"></label><label>งบคงเหลือที่ใช้จ่ายได้ (บาท)<input class=\"inp\" id=\"closeBalance\" inputmode=\"decimal\" placeholder=\"กรอกเพื่อเทียบเงินพอ / ไม่พอ\"></label><button class=\"btn btn-g\" id=\"closeRun\">ตรวจสอบข้อมูลปัจจุบัน</button></form><p class=\"tiny muted\">ยอดประเมินเป็นยอดเต็มก่อนแบ่ง 60/40 · หลายฉบับอาจรวมเป็นหนึ่งหน่วยเบิก · ยังไม่มีผลส่งหรือรอตรวจจะไม่รวมในยอดพร้อมเสนอเบิก</p><div id=\"closeBody\" aria-live=\"polite\"></div></section><details class=\"clay panel\"><summary><b>รายงานการเบิกจ่าย</b></summary><form class=\"row\" id=\"repForm\" style=\"margin-top:14px\"><label>ปีงบประมาณ<input id=\"repFy\" class=\"inp year-input\" inputmode=\"numeric\" value=\"2570\" placeholder=\"ทั้งหมด\"></label><label>แหล่งเงิน<select id=\"repType\" class=\"sel\"><option value=\"BUDGET\">เงินงบประมาณ</option><option value=\"PAID\">เงินนอกงบประมาณ</option><option value=\"\">ทั้ง 2 ประเภท</option></select></label><button class=\"btn btn-g\">แสดงรายงาน</button></form><div id=\"repBody\"><div class=\"note small\"><span class=\"nb\">50 ทะเบียนหมาย: ยังไม่พบการนำเข้า</span> · <span class=\"nb\">42 ผลส่ง: ยังไม่พบการนำเข้า</span> · <span class=\"nb\">18 ราคาหมายฟรี: ยังไม่พบการนำเข้า</span> · <span class=\"nb\">30 บัญชีจ่ายเงิน: ยังไม่พบการนำเข้า</span></div><div class=\"clay panel\"><h3>สรุปรายผู้ส่งตามตัวกรอง</h3><p class=\"tiny muted\">ส่วนต่างเทียบยอดอ้างอิง อาจเกิดจากการรวมหน่วยเบิก ให้ตรวจรายละเอียดก่อนสรุปว่าเงินขาดหรือจ่ายเกิน</p><div class=\"tbl-wrap\"><table class=\"report-officers\"><thead><tr><th class=\"onm\">ผู้ส่ง</th><th class=\"n\">รายการ</th><th class=\"n\">ยอดที่ใช้</th><th class=\"n\">ขาดจากยอดอ้างอิง</th><th class=\"n\">เกินยอดอ้างอิง</th></tr></thead><tbody><tr><td class=\"onm\">เจ้าหน้าที่จำลอง 1</td><td class=\"n\">2</td><td class=\"n\">600.00</td><td class=\"n muted\">0.00</td><td class=\"n muted\">0.00</td></tr><tr><td class=\"onm\">เจ้าหน้าที่จำลอง 2</td><td class=\"n\">2</td><td class=\"n\">800.00</td><td class=\"n muted\">0.00</td><td class=\"n muted\">0.00</td></tr></tbody></table></div><div class=\"row\" style=\"margin-top:14px\"><button class=\"btn btn-sm\" id=\"repCsv\">ดาวน์โหลด CSV</button><button class=\"btn btn-sm\" id=\"repPrint\">พิมพ์รายงาน</button></div></div><div class=\"clay panel\"><h3>จำนวนตามสถานะ</h3><p>พร้อมเบิก / ยังไม่พบประวัติรอบ <b>2</b> รายการ</p><p>รอผลการส่ง <b>1</b> รายการ</p><p>รอตรวจข้อมูล <b>1</b> รายการ</p><p class=\"tiny muted\">สรุปจากหมายที่มีในทะเบียนตามตัวกรอง ส่วนยอดบัญชีและรอบด้านล่างใช้เป็นข้อมูลควบคุมแยกกัน</p></div><div class=\"clay panel\"><h3>ยอดควบคุมจากบัญชีและรอบ</h3><p>บัญชีจ่ายเงินหมายมีเงิน 0&nbsp;รายการ · 0.00&nbsp;บาท</p><p>ยังเชื่อมหมายไม่ครบ 0&nbsp;รายการ · 0.00&nbsp;บาท</p><p>รอบยืนยันตามตัวกรอง 0 รอบ · 0.00&nbsp;บาท</p><p class=\"tiny muted\">ยอดบัญชีที่ยังจับคู่ไม่ได้ยังคงอยู่ในยอดควบคุม ไม่ถูกลบออกจากบัญชีจ่าย</p></div></div ชีหมาย › ประเภท 18. บัญชีจ่ายหมาย พนักงานศาลนี้ส่ง หมายฟรี</div></div></div><div class=\"pinfo-r\"><span class=\"pchip pm\">นอกงบฯ</span><div><b>บัญชีจ่ายเงินที่รอตั้งรอบ</b><div class=\"small muted\">ไม่มี — ดาวน์โหลดไฟล์ บัญชีเบิกจ่ายหมาย › ประเภท 30. บัญชีการจ่ายเงินให้เจ้าพนักงานศาล (แบบหลายใบเสร็จ) แล้วนำเข้าที่ \"นำเข้าข้อมูล › บัญชีจ่ายเงินหมายมีเงิน\"</div></div></div></div><div class=\"clay panel\"><div class=\"row\" style=\"justify-content:space-between;align-items:baseline\"><h3 style=\"margin:0\">รายการยังไม่เข้ารอบในระบบ</h3><span class=\"small muted\">ส่งแล้ว ยังไม่เข้ารอบใด · รวม <b>800.00&nbsp;฿</b> <button type=\"button\" class=\"btn btn-sm\" id=\"pBl\">ดูรายเรื่อง</button></span></div><div class=\"tbl-wrap\" style=\"margin-top:8px\"><table><thead><tr><th class=\"onm\">ผู้ส่งหมาย</th><th class=\"n\">หมายเงิน (เรื่อง)</th><th class=\"n\">บาท</th><th class=\"n\">หมายฟรี (เรื่อง)</th><th class=\"n\">บาท</th><th class=\"n\">เคยเลื่อน</th><th class=\"n\">ค้างนานสุด</th></tr></thead><tbody><tr><td class=\"onm\"><span class=\"odot\" style=\"background:#49c551\"></span>เจ้าหน้าที่จำลอง 1</td><td class=\"n\">0</td><td class=\"n\">0.00</td><td class=\"n\">1</td><td class=\"n\">300.00</td><td class=\"n\">—</td><td class=\"n\">14&nbsp;วัน</td></tr><tr><td class=\"onm\"><span class=\"odot\" style=\"background:#9449c5\"></span>เจ้าหน้าที่จำลอง 2</td><td class=\"n\">0</td><td class=\"n\">0.00</td><td class=\"n\">1</td><td class=\"n\">500.00</td><td class=\"n\">—</td><td class=\"n\">14&nbsp;วัน</td></tr></tbody><tfoot><tr><td><b>รวม</b></td><td class=\"n\"><b>0</b></td><td class=\"n\"><b>0.00</b></td><td class=\"n\"><b>2</b></td><td class=\"n\"><b>800.00</b></td><td class=\"n\"><b>0</b></td><td></td></tr></tfoot></table></div><p class=\"tiny muted\" style=\"margin:8px 2px 0\">หมายเงิน = ส่งแล้วแต่ยังไม่อยู่ในบัญชีจ่ายเงิน · ยังไม่เข้าเกณฑ์: รอผลการส่ง 1 · รอตรวจ 1&nbsp;ฉบับ</p></div><div class=\"clay panel\"><h3>รอบเบิกที่ผ่านมา</h3><div class=\"tbl-wrap\"><table><
